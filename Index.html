<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DisKonkordat • credentials</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #000000;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* glass card — iOS style, minimal, sharp, serious */
    .glass-panel {
      max-width: 480px;
      width: 100%;
      background: rgba(22, 22, 22, 0.75);
      backdrop-filter: blur(25px) saturate(180%);
      -webkit-backdrop-filter: blur(25px) saturate(180%);
      border-radius: 32px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8),
                  0 0 0 1px rgba(180, 0, 0, 0.2) inset,
                  0 0 20px rgba(150, 0, 0, 0.3);
      padding: 2.5rem 2rem;
      transition: all 0.2s ease;
    }

    .glass-panel:hover {
      border-color: rgba(200, 40, 40, 0.3);
      box-shadow: 0 24px 48px rgba(140, 0, 0, 0.3),
                  0 0 0 1.5px rgba(200, 0, 0, 0.3) inset;
    }

    /* content layout — clean, corporate */
    .credentials {
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    /* each row — like iOS settings / credential card */
    .row {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .label {
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #a8a8a8;
      margin-left: 0.5rem;
    }

    .value {
      background: rgba(40, 40, 40, 0.7);
      border-radius: 18px;
      padding: 1rem 1.5rem;
      font-size: 1.25rem;
      font-weight: 500;
      color: #f0f0f0;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-bottom: 2px solid rgba(180, 0, 0, 0.5);
      transition: border 0.15s ease, background 0.15s ease;
      word-break: break-word;
      backdrop-filter: blur(5px);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
    }

    /* special style for the link (interactive, but still minimal) */
    .link-value {
      display: inline-block;
      width: 100%;
      color: #ffffff;
      text-decoration: none;
      font-weight: 500;
      background: rgba(50, 10, 10, 0.4);
      border-bottom: 2px solid #8b0000;
      border-radius: 16px;
      padding: 1rem 1.5rem;
      transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
    }

    .link-value:hover {
      background: rgba(100, 20, 20, 0.5);
      border-bottom-color: #cf0a0a;
      box-shadow: 0 6px 14px rgba(150, 0, 0, 0.4);
    }

    .link-value:active {
      transform: scale(0.99);
      background: rgba(70, 10, 10, 0.7);
    }

    /* subtle red accents, no emojis, just pure structural design */
    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(200, 0, 0, 0.4), rgba(200, 0, 0, 0.7), rgba(200, 0, 0, 0.4), transparent);
      margin: 0.5rem 0;
      border: 0;
    }

    /* very discreet footer – only as a visual anchor */
    .footer-note {
      margin-top: 1.5rem;
      text-align: right;
      font-size: 0.7rem;
      color: #444;
      letter-spacing: 0.8px;
      font-weight: 400;
      border-top: 0.5px solid rgba(150, 0, 0, 0.25);
      padding-top: 1rem;
    }

    .footer-note span {
      color: #5e5e5e;
    }

    /* mono / clean spacing */
    .mono {
      font-family: 'SF Mono', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace;
      letter-spacing: -0.02em;
    }

    /* no decoration, just information */
    .username-field .value {
      border-left: 3px solid #b31b1b;
      background: rgba(20, 20, 20, 0.8);
    }

    /* completely emoji-free, iOS-inspired, corporate-dark */
    @media (max-width: 400px) {
      .glass-panel {
        padding: 1.75rem 1.25rem;
      }
      .value, .link-value {
        font-size: 1rem;
        padding: 0.85rem 1.2rem;
      }
    }
  </style>
</head>
<body>
  <div class="glass-panel">
    <div class="credentials">
      
      <!-- username row: clean, label "username" (professional) -->
      <div class="row username-field">
        <div class="label">username</div>
        <div class="value mono">@Diskonkordat</div>
      </div>

      <!-- subtle separator (invisible but structural) -->
      <div class="divider"></div>

      <!-- group link row: everything as requested, "Group;" included inside the clickable block -->
      <div class="row">
        <div class="label">group link</div>
        <a href="https://t.me/+yb5xwyMuTiZkZDYx" target="_blank" rel="noopener noreferrer" class="link-value mono">
          Group; https://t.me/+yb5xwyMuTiZkZDYx
        </a>
        <!-- the link includes the exact text "Group; https://..." to match specification -->
      </div>

      <!-- minimal footer with subtle reference (no emoji, just a thin line) -->
      <div class="footer-note">
        <span>DisKonkordat • secure channel</span>
      </div>
    </div>
  </div>

  <!-- background hint: pure black with red glow only on card, very serious tone -->
</body>
</html>
